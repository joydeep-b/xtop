# xtop default configuration.
# xtop seeds this into the platform config directory when missing, alongside the
# other bundled layouts. Add more TOML files there for custom layouts;
# selected.toml is the symlink xtop updates to remember the active profile.

[settings]
update_ms = 1000   # sampling + redraw interval
history   = 240    # samples kept for graphs
theme     = "default"
graph_style = "braille" # braille / bar

# ---------------------------------------------------------------------------
# Layout is a recursive split tree that maps onto the terminal area.
# A node is either a `split` (with a direction + children) or a `widget` leaf.
# Each child has a `size`:
#   "NN%"            percentage of the parent
#   "fill" / "min"   take the remaining space (shared equally between fills)
#   { length = N }   fixed N rows (vertical) or columns (horizontal)
#   { ratio = [a,b]} proportional share
# ---------------------------------------------------------------------------
[layout]
direction = "vertical"
children = [
  { size = "60%", split = { direction = "horizontal", children = [
      { size = "50%", split = { direction = "vertical", children = [
          { size = "50%", widget = "cpu" },
          { size = "50%", widget = "memory" },
      ] } },
      { size = "50%", widget = "gpu" },
  ] } },
  { size = "fill", split = { direction = "horizontal", children = [
      { size = "50%", widget = "network" },
      { size = "50%", widget = "disk" },
  ] } },
]

[widgets.cpu]
graph_style = "bar"

[widgets.gpu]
graph_style = "bar"
mode = "auto"            # auto / compact / per_device
show_per_process = false

[widgets.memory]
graph_style = "bar"
show_swap = false       # show swap usage text + gauge
show_usage_bar = false  # show the current RAM usage bar above the history graph

# Disk device names are platform-specific, not mountpoints:
#   Linux: entries from /proc/diskstats (e.g. nvme0n1, sda, dm-0)
#   macOS: BSD whole-disk names (e.g. disk0, disk1)
# Empty list = auto. ZFS pools are Linux OpenZFS only via /proc/spl/kstat/zfs;
# empty zfs_pools = auto-detect all imported pools on Linux.
[widgets.disk]
devices   = []
zfs_pools = []  # [] = auto-detect all imported ZFS pools
graph_style = "bar"

# Empty list = auto. Examples: eth0/enp* on Linux, en0/en1 on macOS.
[widgets.network]
interfaces = []
graph_style = "bar"
