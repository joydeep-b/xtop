# xtop "simple" profile.
# Seeded automatically into the platform config directory when missing. This
# layout focuses on CPU, memory, network, and disk panels for CPU-only systems,
# laptops, and small SSH sessions.

[settings]
update_ms = 1000
history   = 240
theme     = "default"
graph_style = "braille"

[layout]
direction = "vertical"
children = [
  { size = "60%", split = { direction = "horizontal", children = [
      { size = "50%", widget = "cpu" },
      { size = "50%", widget = "memory" },
  ] } },
  { size = "fill", split = { direction = "horizontal", children = [
      { size = "50%", widget = "network" },
      { size = "50%", widget = "disk" },
  ] } },
]

[widgets.cpu]
graph_style = "bar"

[widgets.memory]
graph_style = "bar"
show_swap = false
show_usage_bar = false

[widgets.disk]
# Linux devices use /proc/diskstats names (e.g. sda); macOS uses BSD names
# (e.g. disk0). ZFS pools are Linux OpenZFS only.
devices   = []
zfs_pools = []
graph_style = "bar"

[widgets.network]
# Empty list = auto. Examples: eth0/enp* on Linux, en0/en1 on macOS.
interfaces = []
graph_style = "bar"
