name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-musl-amd64:
    name: Linux amd64 musl
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build musl release
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Package release asset
        env:
          ASSET_NAME: xtop-${{ github.ref_name }}-x86_64-unknown-linux-musl.tar.gz
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/xtop dist/xtop
          chmod 755 dist/xtop
          tar -czf "$ASSET_NAME" -C dist xtop

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: xtop-${{ github.ref_name }}-x86_64-unknown-linux-musl.tar.gz
